
name: Aggiorna JSON da Google Sheets

on:
  workflow_dispatch:

  schedule:
    - cron: '*/5 * * * *'
      timezone: 'Europe/Rome'

permissions:
  contents: write

concurrency:
  group: aggiorna-json
  cancel-in-progress: false

jobs:
  aggiorna-json:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Converti Google Sheets in JSON
        env:
          GOOGLE_SHEET_CSV_URL: ${{ vars.GOOGLE_SHEET_CSV_URL }}
        run: python esporta_json.py

      - name: Aggiorna JSON nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dati.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "Aggiornamento automatico JSON"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
