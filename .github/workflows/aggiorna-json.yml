name: Aggiorna orari su Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
      timezone: 'Europe/Rome'

permissions:
  contents: read

concurrency:
  group: aggiorna-orari-supabase
  cancel-in-progress: false

jobs:
  aggiorna-orari:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v6
      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Importa Google Sheets in Supabase
        env:
          GOOGLE_SHEET_CSV_URL: ${{ vars.GOOGLE_SHEET_CSV_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python esporta_json.py
